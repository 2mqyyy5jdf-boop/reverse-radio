<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RADIO REVERSE</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:black;
font-family:Arial, sans-serif;
overflow:hidden;
color:#d9ff00;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:
radial-gradient(circle at top,#ff00ff33,transparent 40%),
black;
}

.container{
width:100%;
max-width:1100px;
background:#050505;
border:4px solid #ff00ff;
border-radius:40px;
padding:25px;
box-shadow:0 0 40px #ff00ff;
position:relative;
overflow:hidden;
}

.noise{
position:absolute;
inset:0;
opacity:0.08;
background-image:url("https://grainy-gradients.vercel.app/noise.svg");
pointer-events:none;
}

.top{
display:flex;
justify-content:space-between;
align-items:flex-start;
flex-wrap:wrap;
gap:20px;
}

.fm{
background:#d9ff00;
color:black;
padding:10px 20px;
border-radius:30px;
font-weight:bold;
display:inline-block;
margin-bottom:20px;
}

.title{
font-size:clamp(38px,18vw,90px);
font-weight:900;
font-style:italic;
line-height:0.8;
color:#ff00ff;
text-shadow:0 0 20px #ff00ff;
}

.subtitle{
font-size:clamp(28px,14vw,70px);
font-weight:900;
font-style:italic;
line-height:0.8;
color:#d9ff00;
text-shadow:0 0 20px #d9ff00;
}

.live{
color:red;
font-weight:bold;
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:0.4;
}
}

.player{
margin-top:25px;
border:2px solid #ff00ff;
border-radius:30px;
padding:20px;
background:#111;
}

.track{
font-size:clamp(18px,5vw,35px);
font-weight:bold;
word-break:break-word;
margin-bottom:20px;
line-height:1.1;
}

.wave{
height:60px;
display:flex;
align-items:end;
gap:3px;
margin-bottom:20px;
overflow:hidden;
}

.bar{
flex:1;
background:#d9ff00;
border-radius:10px;
animation:bounce 1s infinite ease-in-out;
}

@keyframes bounce{
0%,100%{
height:10px;
}
50%{
height:60px;
}
}

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:25px;
}

button{
background:#ff00ff;
color:black;
border:none;
padding:15px 20px;
border-radius:20px;
font-size:16px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px #ff00ff;
flex:1;
min-width:120px;
}

button:hover{
transform:scale(1.05);
}

.playlist{
max-height:180px;
overflow:auto;
border-top:1px solid #333;
padding-top:20px;
}

.song{
padding:12px;
margin-bottom:10px;
border-radius:15px;
background:#181818;
}

.active{
background:#ff00ff;
color:black;
font-weight:bold;
}

.footer{
margin-top:20px;
opacity:0.5;
letter-spacing:3px;
font-size:12px;
text-align:center;
}

@media(max-width:700px){

.container{
padding:18px;
border-radius:25px;
}

.player{
padding:15px;
}

button{
width:100%;
}

.playlist{
max-height:150px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="noise"></div>

<div class="top">

<div>

<div class="fm" id="fmNumber">
FM 98.6
</div>

<div class="title">
RADIO
</div>

<div class="subtitle">
REVERSE
</div>

</div>

<div class="live">
● LIVE
</div>

</div>

<div class="player">

<div class="track" id="trackName">
loading...
</div>

<div class="wave" id="wave"></div>

<div class="buttons">

<button onclick="prevTrack()">
◀ BACK
</button>

<button onclick="togglePlay()">
PLAY
</button>

<button onclick="nextTrack()">
NEXT ▶
</button>

</div>

<div class="playlist" id="playlist"></div>

</div>

<div class="footer">
NO RULES • NO SIGNAL • JUST REVERSE
</div>

<audio id="audioPlayer"></audio>

</div>

<script>

const filler = [
"audio/filler.mp3",
"audio/filler_2.mp3",
"audio/filler_3.mp3",
"audio/filler_4.mp3",
"audio/filler_5.mp3"
];

const news = [
"audio/polit_news.mp3",
"audio/klima_news.mp3",
"audio/sicherheit_news.mp3",
"audio/sozial_news.mp3",
"audio/wetter_news.mp3",
"audio/stau_meldung.mp3",
"audio/sport_news.mp3"
];

const spoken = [
"audio/spoken_1.mp3",
"audio/spoken_2.mp3",
"audio/spoken_3.mp3",
"audio/spoken_4.mp3",
"audio/spoken_5.mp3",
"audio/spoken_6.mp3",
"audio/spoken_7.mp3",
"audio/spoken_8.mp3",
"audio/spoken_9.mp3",
"audio/spoken_10.mp3",
"audio/spoken_11.mp3",
"audio/spoken_12.mp3",
"audio/spoken_13.mp3",
"audio/spoken_14.mp3",
"audio/spoken_15.mp3"
];

function random(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

const playlist = [
"audio/filler_4.mp3",
"audio/spoken_14.mp3",
"audio/wetter_news.mp3"
];

for(let i=0;i<25;i++){

playlist.push(random(spoken));
playlist.push(random(filler));
playlist.push(random(news));

}

let currentTrack = 0;

const player = document.getElementById("audioPlayer");

function updateTrack(){

player.src = playlist[currentTrack];

document.getElementById("trackName").innerText =
playlist[currentTrack]
.replace("audio/","")
.replace(".mp3","")
.replaceAll("_"," ");

renderPlaylist();

}

function togglePlay(){

player.play();

}

function nextTrack(){

currentTrack++;

if(currentTrack >= playlist.length){
currentTrack = 0;
}

updateTrack();

player.play();

}

function prevTrack(){

currentTrack--;

if(currentTrack < 0){
currentTrack = playlist.length - 1;
}

updateTrack();

player.play();

}

player.onended = nextTrack;

function renderPlaylist(){

const container =
document.getElementById("playlist");

container.innerHTML = "";

playlist.forEach((song,index)=>{

const div = document.createElement("div");

div.className = "song";

if(index === currentTrack){
div.classList.add("active");
}

div.innerText =
song
.replace("audio/","")
.replace(".mp3","")
.replaceAll("_"," ");

container.appendChild(div);

});

}

const wave = document.getElementById("wave");

for(let i=0;i<60;i++){

const bar = document.createElement("div");

bar.className = "bar";

bar.style.animationDuration =
(0.5 + Math.random()) + "s";

bar.style.height =
(10 + Math.random()*60) + "px";

wave.appendChild(bar);

}

document.getElementById("fmNumber").innerText =
"FM " + (87 + Math.random()*20).toFixed(1);

updateTrack();

</script>

</body>
</html>
